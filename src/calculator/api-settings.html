<template id="jeagoApiIntegration">
<button class="mode-btn" id="apiSettingsBtn" type="button">API 연결 설정</button>
<div class="api-fee-controls" id="apiFeeControls">
            <div class="field"><label for="apiFeeAccount">판매자 계정</label><select id="apiFeeAccount"><option value="1">계정 1</option><option value="2">계정 2</option></select></div>
            <div class="field"><label for="apiFeeMode">수수료 적용</label><select id="apiFeeMode"><option value="auto">API 자동 적용</option><option value="manual">직접 입력</option></select></div>
            <div class="field"><label for="apiFeeProduct">수수료 기준 상품</label><select id="apiFeeProduct"><option value="">선택 모델과 자동 연결</option></select></div>
            <p id="apiFeeStatus" class="field-status" aria-live="polite">회사 API를 연결하면 상품별 수수료를 자동 적용합니다.</p>
            <p class="api-fee-note">선택한 계정의 최근 7일(한국시간, 어제까지) 상품별 수수료 총액 ÷ 매출 기준금액의 가중평균입니다. 거래가 없으면 직접 입력하며 월 이용료·광고비·로켓그로스 비용은 별도입니다.</p>
          </div>
          
<dialog id="apiSettingsDialog" class="api-settings-dialog" aria-labelledby="apiSettingsTitle">
    <header class="api-dialog-head"><h2 id="apiSettingsTitle">회사 API 연결</h2><button id="apiSettingsClose" class="ghost-btn" type="button" aria-label="API 설정 닫기">닫기</button></header>
    <p id="apiAdminNotice" role="status">연결 상태를 확인하고 있습니다.</p>
    <form class="api-provider" data-api-platform="smartstore" autocomplete="off">
  <h3>네이버 스마트스토어</h3><p class="api-connection-status">연결 상태 확인 중</p><p class="api-fee-note">네이버 커머스API 키와 정산 조회 권한이 필요합니다.</p>
  <div class="api-credentials" hidden><label>애플리케이션 ID<input type="password" name="clientId" maxlength="200" autocomplete="off" placeholder="새 키 입력 · 비워두면 기존 값 유지" /></label><label>애플리케이션 시크릿<input type="password" name="clientSecret" maxlength="200" autocomplete="off" placeholder="새 키 입력 · 비워두면 기존 값 유지" /></label></div>
  <div class="api-date-range"><label>조회 시작일<input type="date" name="from" required /></label><label>조회 종료일<input type="date" name="to" required /></label></div>
  <div class="api-actions"><button class="primary-btn" type="submit" data-api-save hidden>저장하고 연결 확인</button><button class="ghost-btn" type="button" data-api-refresh disabled>수수료 새로고침</button><button class="ghost-btn" type="button" data-api-disconnect hidden>연결 해제</button></div>
  <p class="api-action-status" role="status"></p>
</form><form class="api-provider" data-api-platform="coupang" autocomplete="off">
  <h3>쿠팡</h3><p class="api-connection-status">연결 상태 확인 중</p><p class="api-fee-note">쿠팡 WING Open API 키와 판매자 ID를 입력하세요.</p>
  <div class="api-credentials" hidden><label>Access Key<input type="password" name="accessKey" maxlength="200" autocomplete="off" placeholder="새 키 입력 · 비워두면 기존 값 유지" /></label><label>Secret Key<input type="password" name="secretKey" maxlength="200" autocomplete="off" placeholder="새 키 입력 · 비워두면 기존 값 유지" /></label><label>판매자 ID (Vendor ID)<input type="text" name="vendorId" maxlength="200" autocomplete="off" placeholder="새 키 입력 · 비워두면 기존 값 유지" /></label></div>
  <div class="api-date-range"><label>조회 시작일<input type="date" name="from" required /></label><label>조회 종료일<input type="date" name="to" required /></label></div>
  <div class="api-actions"><button class="primary-btn" type="submit" data-api-save hidden>저장하고 연결 확인</button><button class="ghost-btn" type="button" data-api-refresh disabled>수수료 새로고침</button><button class="ghost-btn" type="button" data-api-disconnect hidden>연결 해제</button></div>
  <p class="api-action-status" role="status"></p>
</form>
    <p class="api-fee-note">네이버·쿠팡 각각 계정 1과 2의 키를 별도로 입력하세요. 최근 7일은 한국시간 어제까지이며 네이버는 정산 기준일, 쿠팡은 매출인식일 기준입니다. 회사 PC 조회 프로그램이 실행 중이어야 실제 거래를 조회합니다.</p>
  </dialog>
</template>
