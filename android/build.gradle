plugins { id 'com.android.application' version '8.9.2' }
android {
 namespace 'com.jcsh3132.jeago'
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'com.jcsh3132.jeago'; minSdk 23; targetSdk 35; versionCode 6; versionName '1.3.0' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res', '../work/android-firebase-res'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs { release { storeFile file('../work/android-signing/jeago-release.p12'); storePassword System.getenv('JEAGO_SIGNING_PASSWORD'); keyAlias 'jeago'; keyPassword System.getenv('JEAGO_SIGNING_PASSWORD') } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
layout.buildDirectory.set(file('../work/android-gradle-build'))
dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.1' }
