{% extends "base.html" %}
{% block title %}모델 등록{% endblock %}{% block page_title %}모델 등록{% endblock %}
{% block content %}<div class="form-page"><div class="form-card"><div class="form-heading"><span class="section-kicker">NEW ITEM</span><h2>새 모델 등록</h2><p>재고 추적을 시작할 모델의 기본 정보를 입력하세요.</p></div><form method="POST"><div class="field"><label for="name">모델명</label><input type="text" id="name" name="name" placeholder="예: CLT-K510S" required></div><div class="field"><label for="manager">담당자</label><select id="manager" name="manager" required>{% for manager in managers %}<option value="{{ manager }}">{{ manager }}</option>{% endfor %}</select></div><div class="field"><label for="category">카테고리</label><select id="category" name="category" required>{% for main, device_rows in hierarchy %}{% for device, cats in device_rows %}<optgroup label="{{ main.label }} · {{ device.label }}">{% for cat in cats %}<option value="{{ cat.name }}" {% if selected_category == cat.name %}selected{% endif %}>{{ cat.label }}</option>{% endfor %}</optgroup>{% endfor %}{% endfor %}</select></div><div class="form-actions"><a href="{{ url_for('index', category=selected_category) if selected_category else url_for('index') }}" class="top-btn ghost">취소</a><button type="submit" class="top-btn primary">모델 등록</button></div></form></div></div>{% endblock %}
