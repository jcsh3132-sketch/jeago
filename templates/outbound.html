{% extends "base.html" %}{% block title %}출고 처리{% endblock %}{% block page_title %}출고 처리{% endblock %}
{% block content %}<div class="form-page"><div class="form-card transaction-card"><div class="transaction-type outbound-type">OUT</div><div class="form-heading"><span class="section-kicker">STOCK OUT</span><h2>{{ item.name }}</h2><p>현재 출고 가능한 재고는 <b>{{ item.quantity }}</b>개입니다.</p></div><form method="POST"><div class="field"><label for="quantity">출고 수량</label><input type="number" id="quantity" name="quantity" min="1" max="{{ item.quantity }}" placeholder="0" required autofocus></div><div class="field"><label for="customer_name">출고업체</label><input type="text" id="customer_name" name="customer_name" list="partner-list" value="{{ request.form.get('customer_name','') }}" placeholder="거래처를 선택하거나 직접 입력" autocomplete="off" required><datalist id="partner-list">{% for partner in partners %}<option value="{{ partner.name }}">{% endfor %}</datalist></div><div class="field"><label for="manager">처리 담당자</label><select id="manager" name="manager" required>{% for manager in managers %}<option value="{{ manager }}" {% if request.form.get('manager') == manager %}selected{% endif %}>{{ manager }}</option>{% endfor %}</select></div><div class="form-actions"><a href="{{ url_for('index') }}" class="top-btn ghost">취소</a><button type="submit" class="top-btn danger-btn">출고 완료</button></div></form></div></div>{% endblock %}
