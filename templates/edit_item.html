{% extends "base.html" %}
{% block title %}모델 수정{% endblock %}{% block page_title %}모델 수정{% endblock %}
{% block content %}<div class="form-page"><div class="form-card"><div class="form-heading"><span class="section-kicker">EDIT ITEM</span><h2>{{ item.name }}</h2><p>모델 기본 정보를 수정합니다.</p></div><form method="POST"><div class="field"><label for="name">모델명</label><input type="text" id="name" name="name" value="{{ item.name }}" required></div><div class="field"><label for="manager">담당자</label><select id="manager" name="manager" required>{% for manager in managers %}<option value="{{ manager }}" {% if manager == item.manager %}selected{% endif %}>{{ manager }}</option>{% endfor %}</select></div><div class="field"><label for="category">카테고리</label><select id="category" name="category" required>{% for main, device_rows in hierarchy %}{% for device, cats in device_rows %}<optgroup label="{{ main.label }} · {{ device.label }}">{% for cat in cats %}<option value="{{ cat.name }}" {% if cat.name == item.category %}selected{% endif %}>{{ cat.label }}</option>{% endfor %}</optgroup>{% endfor %}{% endfor %}</select></div><div class="form-actions"><a href="{{ url_for('index') }}" class="top-btn ghost">취소</a><button type="submit" class="top-btn primary">변경사항 저장</button></div></form></div></div>{% endblock %}
