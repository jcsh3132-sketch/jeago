{% extends "base.html" %}{% block title %}입고 처리{% endblock %}{% block page_title %}입고 처리{% endblock %}
{% block content %}<div class="form-page"><div class="form-card transaction-card"><div class="transaction-type inbound-type">IN</div><div class="form-heading"><span class="section-kicker">STOCK IN</span><h2>{{ item.name }}</h2><p>현재 재고 <b>{{ item.quantity }}</b>개에 입고 수량을 추가합니다.</p></div><form method="POST"><div class="field"><label for="quantity">입고 수량</label><input type="number" id="quantity" name="quantity" min="1" placeholder="0" required autofocus></div><div class="field"><label for="manager">처리 담당자</label><select id="manager" name="manager" required>{% for manager in managers %}<option value="{{ manager }}">{{ manager }}</option>{% endfor %}</select></div><div class="form-actions"><a href="{{ url_for('index') }}" class="top-btn ghost">취소</a><button type="submit" class="top-btn success">입고 완료</button></div></form></div></div>{% endblock %}
